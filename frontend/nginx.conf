server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    #
    # user-service is reached through the ingress controller rather than
    # directly, so that browser traffic is subject to the same canary
    # weighting as everything else at the edge.
    #
    # Proxying straight to the ClusterIP (as the other four blocks still do,
    # and as this block used to) bypasses the ingress entirely. The canary
    # weight would then apply only to synthetic load, and the claim that a
    # percentage of real users reach the new version would not be true.
    #
    # Note there is no URI after the host and no trailing slash: the original
    # /api/users/... path must arrive at the ingress intact so the Ingress
    # rule can match it and apply its own rewrite. The Host header is set to
    # the fixed host both Ingress objects declare - without it the request
    # matches no rule and the controller returns 404.
    #
    # Trade-off accepted: the frontend now depends on the ingress controller
    # being healthy for user-service calls.
    #
    location /api/users/ {
        proxy_pass http://ingress-nginx-controller.ingress-nginx.svc.cluster.local;
        proxy_http_version 1.1;

        proxy_set_header Host koalatech.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/students/ {
        proxy_pass http://student-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/lecturers/ {
        proxy_pass http://lecturer-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/courses/ {
        proxy_pass http://course-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/enrollments/ {
        proxy_pass http://enrollment-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}